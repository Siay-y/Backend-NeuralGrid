services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neuralgrid
      POSTGRES_PASSWORD: neuralgrid
      POSTGRES_DB: neuralgrid
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neuralgrid -d neuralgrid']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
